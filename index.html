<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KMEFIC Daily Hub</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#062a33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg0:#e8e0d2;--bg1:#d6c8b3;--o1:#f7f1e8;--o2:#8fc1bc;--o3:#d2ab6c;--o4:#b9a58a;
 --glass:rgba(255,255,255,.40);--glass2:rgba(255,255,255,.62);--gline:rgba(255,255,255,.7);--gshadow:0 18px 50px -24px rgba(60,45,25,.45);
 --txt:#16252a;--soft:#38484d;--mut:#66767b;--gold:#8e6a1f;--gold2:#a77d27;--goldbg:rgba(196,160,68,.18);
 --up:#17845a;--upbg:rgba(23,132,90,.12);--down:#c03c35;--downbg:rgba(192,60,53,.11);--amber:#9a640f;--amberbg:rgba(196,140,40,.16);--blue:#2a64a8;--bluebg:rgba(42,100,168,.12);
 --pill:#16252a;--pillTxt:#ffffff;--line:rgba(22,37,42,.10);--line2:rgba(22,37,42,.18);
 --phop:.22;--spot1:#0f8f80;--spot2:#0a6158;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg0:#03161c;--bg1:#062a33;--o1:#0c4d58;--o2:#00788b;--o3:#7a6228;--o4:#0a2a46;
 --glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.10);--gline:rgba(255,255,255,.12);--gshadow:0 20px 60px -26px rgba(0,0,0,.75);
 --txt:#eef4f5;--soft:#c2d1d5;--mut:#89a1a7;--gold:#d9b75e;--gold2:#ebd08b;--goldbg:rgba(217,183,94,.14);
 --up:#45d095;--upbg:rgba(69,208,149,.13);--down:#ff7b71;--downbg:rgba(255,123,113,.13);--amber:#f1b75a;--amberbg:rgba(241,183,90,.14);--blue:#86bbff;--bluebg:rgba(134,187,255,.13);
 --pill:#eef4f5;--pillTxt:#082a30;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
 --phop:.42;--spot1:#109a8a;--spot2:#0a5d55;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg0:#03161c;--bg1:#062a33;--o1:#0c4d58;--o2:#00788b;--o3:#7a6228;--o4:#0a2a46;
 --glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.10);--gline:rgba(255,255,255,.12);--gshadow:0 20px 60px -26px rgba(0,0,0,.75);
 --txt:#eef4f5;--soft:#c2d1d5;--mut:#89a1a7;--gold:#d9b75e;--gold2:#ebd08b;--goldbg:rgba(217,183,94,.14);
 --up:#45d095;--upbg:rgba(69,208,149,.13);--down:#ff7b71;--downbg:rgba(255,123,113,.13);--amber:#f1b75a;--amberbg:rgba(241,183,90,.14);--blue:#86bbff;--bluebg:rgba(134,187,255,.13);
 --pill:#eef4f5;--pillTxt:#082a30;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
 --phop:.42;--spot1:#109a8a;--spot2:#0a5d55;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg0);color:var(--txt);font:15px/1.65 Cairo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button,select{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3,h4{font-family:Cairo,sans-serif;margin:0;font-weight:700;text-wrap:balance}
.num{font-family:Cairo,ui-monospace,monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.mut{color:var(--mut)}.soft{color:var(--soft)}.up{color:var(--up)}.down{color:var(--down)}
[hidden]{display:none!important}
/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,var(--bg1),var(--bg0) 60%)}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.75}
.bg .o1{width:52vw;height:52vw;background:var(--o1);top:-14vw;inset-inline-end:-10vw;animation:drift 38s ease-in-out infinite alternate}
.bg .o2{width:40vw;height:40vw;background:var(--o2);bottom:-12vw;inset-inline-start:-8vw;opacity:.5;animation:drift 46s ease-in-out infinite alternate-reverse}
.bg .o3{width:30vw;height:30vw;background:var(--o3);top:38%;inset-inline-start:34%;opacity:.35;animation:drift 52s ease-in-out infinite alternate}
.bg .o4{width:36vw;height:36vw;background:var(--o4);top:10%;inset-inline-start:-12vw;opacity:.45}
.bg .ph{position:absolute;top:-6vh;inset-inline-end:-4vw;width:62vw;max-width:1000px;opacity:var(--phop);filter:blur(3px) saturate(1.1);mask-image:radial-gradient(closest-side,#000 55%,transparent);-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent)}
.bg .tw{position:absolute;inset-inline-start:2vw;bottom:-2vh;height:62vh;max-height:620px;opacity:.16;filter:blur(1.5px) saturate(.6)}
@keyframes drift{to{transform:translate(4vw,3vw) scale(1.08)}}
/* ---------- glass ---------- */
.g{background:var(--glass);border:1px solid var(--gline);border-radius:22px;box-shadow:var(--gshadow),inset 0 1px 0 rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px) saturate(1.45);backdrop-filter:blur(22px) saturate(1.45)}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.g{background:var(--glass2)}}
.pad{padding:18px 20px}
.bi{animation:bi .62s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes bi{from{opacity:0;filter:blur(14px);transform:translateY(12px) scale(.985)}to{opacity:1;filter:none;transform:none}}
/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.55;padding:1px 9px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.chip.g2{color:var(--gold);background:var(--goldbg);border-color:transparent}
.chip.r{color:var(--down);background:var(--downbg);border-color:transparent}
.chip.a{color:var(--amber);background:var(--amberbg);border-color:transparent}
.chip.b{color:var(--blue);background:var(--bluebg);border-color:transparent}
.chip.u{color:var(--up);background:var(--upbg);border-color:transparent}
.chip.new{background:var(--gold);color:#1a1405;border-color:transparent;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.srcs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:10px}
.srcs a{color:var(--mut);border-bottom:1px dotted var(--line2)}
.srcs a:hover{color:var(--blue);text-decoration:none}
.srcs::before{content:attr(data-l);color:var(--mut);font-size:11.5px}
/* ---------- shell ---------- */
.proto{font-size:12.5px;text-align:center;padding:6px 14px;background:var(--goldbg);color:var(--gold);position:relative;z-index:5}
.top{position:sticky;top:10px;z-index:40;margin:10px auto 0;max-width:1320px;width:calc(100% - 24px);display:flex;align-items:center;gap:12px;padding:8px 10px 8px 12px;border-radius:999px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:50%;background:var(--pill);color:var(--pillTxt);display:grid;place-items:center;font:700 12px Cairo,monospace;flex:none}
.brand b{font:700 15px/1.15 Cairo,sans-serif;display:block}
.brand small{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.ask{flex:1;min-width:180px;max-width:460px;margin-inline:auto;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass2);color:var(--mut);font-size:13.5px;text-align:start}
.ask .orb{width:18px;height:18px;border-radius:50%;background:conic-gradient(from 200deg,var(--o2),var(--gold),#8f7bff,var(--o2));box-shadow:0 0 12px var(--o2);flex:none}
.ask kbd{margin-inline-start:auto;font:500 10.5px Cairo,monospace;border:1px solid var(--line2);border-radius:5px;padding:0 5px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{height:38px;min-width:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;transition:transform .15s,background .2s}
.tb:hover{background:var(--glass)}.tb:active{transform:scale(.96)}
.tb svg{width:16px;height:16px}
.sel{height:38px;border-radius:999px;border:1px solid var(--line);background-color:var(--glass2);padding:0 14px 0 30px;font-size:13px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:16px 17px,11px 17px;background-size:5px 5px;background-repeat:no-repeat}
html[dir="ltr"] .sel{padding:0 30px 0 14px;background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px}
.depOn{border-color:var(--gold);color:var(--gold)}
.rail{position:fixed;inset-inline-start:14px;top:50%;transform:translateY(-50%);z-index:35;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:999px}
.rail button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;position:relative;color:var(--soft);transition:background .2s,color .2s}
.rail button svg{width:19px;height:19px}
.rail button:hover{background:var(--glass2)}
.rail button.on{background:var(--pill);color:var(--pillTxt);box-shadow:0 6px 18px -6px rgba(0,0,0,.4)}
.rail button span{position:absolute;inset-inline-start:52px;white-space:nowrap;background:var(--pill);color:var(--pillTxt);font-size:12px;padding:3px 10px;border-radius:8px;opacity:0;transform:translateX(6px);pointer-events:none;transition:opacity .15s,transform .15s}
html[dir="rtl"] .rail button span{transform:translateX(-6px)}
.rail button:hover span{opacity:1;transform:none}
.rail button em{position:absolute;top:2px;inset-inline-end:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:#1a1405;font:700 10px/16px Cairo,monospace;font-style:normal}
.dock{position:fixed;bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:35;display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--soft);white-space:nowrap;transition:background .25s,color .25s}
.dock button.on{background:var(--pill);color:var(--pillTxt)}
main{max-width:1320px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:1100px){main{padding-inline:84px}}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 4px 16px}
.vh>div{min-width:0}.vh .chip{white-space:normal}.vh h2{font-size:clamp(24px,2.6vw,32px);font-weight:700}
.vh p{margin:2px 0 0;color:var(--mut);font-size:13.5px;max-width:72ch}
.view{margin-bottom:40px}
.app .view{display:none;margin-bottom:0}.app .view.on{display:block}
.det{border-top:1px dashed var(--line2);margin-top:12px;padding-top:12px}
.app .det{display:none}
.it{cursor:pointer;transition:transform .2s var(--ease),background .2s}
.it:hover{background:var(--glass2)}
.it:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.flt-hide{display:none!important}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.s16{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.s125{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.s15{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)!important}}
.lbl{font-size:12px;color:var(--mut);display:block}
.ct{font-size:15px;font-weight:700;font-family:Cairo,sans-serif;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.more{font-size:12.5px;color:var(--gold);background:none;border:0;padding:0;white-space:nowrap}
/* ---------- overview ---------- */
.ovg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.hero{padding:26px 28px}
.kick{font:500 12px Cairo,monospace;color:var(--gold);letter-spacing:.12em}
.hero h1{font-size:clamp(26px,3.3vw,40px);line-height:1.22;margin:12px 0 6px;font-weight:700}
.hero .sub{font:500 16px/1.5 Cairo,sans-serif;color:var(--gold2);margin:0 0 12px}
.hero .para{color:var(--soft);margin:0;max-width:66ch}
.vps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.vp{display:flex;flex-direction:column;gap:6px;text-align:start;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--glass2);color:inherit;transition:transform .2s var(--ease),border-color .2s}
.vp:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.vp b{font:500 11.5px Cairo,monospace;color:var(--gold)}
.vp span{font-size:13.5px;line-height:1.6}
.vp i{font-style:normal;font-size:12px;color:var(--gold);margin-top:auto}
.spot{border-radius:22px;padding:20px 22px;color:#fff;background:linear-gradient(140deg,var(--spot1),var(--spot2));box-shadow:0 24px 50px -24px rgba(5,80,70,.7);position:relative;overflow:hidden;cursor:pointer}
.spot::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);top:-90px;inset-inline-end:-60px}
.spot small{opacity:.8;font-size:12.5px}
.spot b{display:block;font:700 34px/1.1 Cairo,monospace;margin:6px 0}
.spot .nm{font-weight:700;font-size:15.5px}
.spot .cd{display:inline-block;margin-top:10px;font-size:12px;background:rgba(255,255,255,.16);border-radius:999px;padding:2px 10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.st{padding:14px 16px;border-radius:18px;text-align:start;border:1px solid var(--gline);background:var(--glass);transition:transform .2s var(--ease)}
.st:hover{transform:translateY(-3px)}
.st small{display:block;font-size:12px;color:var(--mut)}
.st b{display:block;font:700 26px/1.2 Cairo,monospace;margin-top:4px}
.bars{display:grid;gap:8px;direction:ltr}
.br{display:grid;grid-template-columns:100px 1fr 70px;gap:10px;align-items:center;font-size:12.5px}
.br .lb{direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}
html[dir="ltr"] .br .lb{direction:ltr;text-align:left}
.br .tr{position:relative;height:10px;border-radius:5px;background:var(--line)}
.br .tr::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.br .f{position:absolute;top:0;height:10px;border-radius:5px;width:0;transition:width .9s var(--ease)}
.br .f.neg{right:50%;background:linear-gradient(270deg,var(--down),color-mix(in srgb,var(--down) 55%,transparent))}
.br .f.pos{left:50%;background:linear-gradient(90deg,var(--up),color-mix(in srgb,var(--up) 55%,transparent))}
.br .v{text-align:right;font:500 12.5px Cairo,monospace}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.kp{padding:10px 10px;border-radius:14px;background:var(--glass2);min-width:0}
.kp small{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp b{display:block;font:500 14.5px Cairo,monospace;direction:ltr;text-align:right}
.kp em{display:block;font:400 11px Cairo,monospace;font-style:normal;direction:ltr;text-align:right}
html[dir="ltr"] .kp b,html[dir="ltr"] .kp em{text-align:left}
.when{font-size:11.5px;color:var(--mut);margin-top:10px}
/* ---------- inference ---------- */
.ic{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ic h3{font-size:16.5px;line-height:1.45}
.ic .so{color:var(--soft);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.app .ic .so{display:-webkit-box}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys div{padding:10px 12px;border-radius:14px;background:var(--glass2)}
.keys small{display:block;font-size:11px;color:var(--mut);line-height:1.35}
.keys b{display:block;font:700 16px Cairo,monospace;margin-top:3px}
.keys b.up{color:var(--up)}.keys b.down{color:var(--down)}
.conf{display:inline-flex;gap:3px;align-items:center;font-size:11.5px;color:var(--mut)}
.conf i{width:14px;height:4px;border-radius:2px;background:var(--line2)}
.conf i.on{background:var(--gold)}
.ic .foot>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.ic .foot>span:last-child{white-space:nowrap}.ic .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;font-size:12px;color:var(--mut)}
.eqb{background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.eqb h4{margin:0 0 8px;font:500 11.5px Cairo,monospace;color:var(--gold);letter-spacing:.1em}
.eqrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 14px}
.eqrows div small{display:block;color:var(--mut);font-size:11.5px;line-height:1.4}
.eqrows div b{font:700 16px Cairo,monospace}
.eqrows div b.down{color:var(--down)}.eqrows div b.up{color:var(--up)}.eqrows div b.na{font:400 13px Cairo,sans-serif;color:var(--mut)}
.formula{font:400 12px/1.7 Cairo,monospace;color:var(--soft);direction:ltr;text-align:left;margin-top:10px;border-top:1px dashed var(--line2);padding-top:8px;white-space:pre-wrap}
.ruler{position:relative;height:66px;margin:6px 6px 0;direction:ltr}
.ruler .ax{position:absolute;left:0;right:0;top:32px;height:3px;background:var(--line2);border-radius:2px}
.ruler .zone{position:absolute;top:30px;height:7px;border-radius:4px;transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease) .2s}
.in .ruler .zone,.ruler.in .zone{transform:scaleX(1)}
.ruler .zone.pos{background:linear-gradient(90deg,color-mix(in srgb,var(--up) 30%,transparent),var(--up))}
.ruler .zone.neg{background:linear-gradient(90deg,var(--down),color-mix(in srgb,var(--down) 30%,transparent))}
.ruler .mk{position:absolute;top:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left 1s var(--ease)}
.ruler .mk::before{content:"";width:2px;height:19px;background:currentColor;border-radius:1px}
.ruler .mk span{position:absolute;white-space:nowrap;font:500 11px/1.25 Cairo,monospace;text-align:center}
.ruler .mk.t span{bottom:22px}.ruler .mk.b span{top:22px}
.ruler .mk span small{display:block;font:400 10.5px Cairo,sans-serif;color:var(--mut)}
.recs{display:grid;gap:6px}
.rec{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px;padding:9px 12px;border-radius:12px;background:var(--glass2);border:1px solid transparent;transition:opacity .3s,border-color .3s}
.rec .chip{margin-top:2px}
.rec.dim{opacity:.35}.rec.hit{border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.chk{font-size:12.5px;color:var(--mut)}
.warn{font-size:12.5px;color:var(--amber)}
.mvt{width:100%;border-collapse:collapse;font-size:13px}
.mvt th{font-weight:500;color:var(--mut);font-size:12px;text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
.mvt td{padding:7px 4px;border-bottom:1px solid var(--line)}
.mvt td.n{font-family:Cairo,monospace;direction:ltr;text-align:end;white-space:nowrap}
.mvt .bw{width:70px}.mvt .bb{height:5px;border-radius:3px;width:0;transition:width .7s var(--ease)}
.mvt .bb.up{background:var(--up)}.mvt .bb.down{background:var(--down)}
/* ---------- tables / lists ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{position:sticky;top:0;z-index:1;font-weight:500;font-size:12px;color:var(--mut);text-align:start;padding:10px 12px;background:var(--glass2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tbl th:first-child{border-start-start-radius:12px;border-end-start-radius:12px}.tbl th:last-child{border-start-end-radius:12px;border-end-end-radius:12px}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.it:hover td{background:var(--glass2)}
.tbl tr.grp td{font:500 11.5px Cairo,monospace;color:var(--gold);letter-spacing:.08em;padding:14px 12px 6px;border-bottom:0;background:transparent;cursor:default}
.tbl tr.today td:first-child{box-shadow:inset -3px 0 0 var(--gold)}
html[dir="ltr"] .tbl tr.today td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.scroll{max-height:560px;overflow:auto;border-radius:14px;overscroll-behavior:contain}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--gline)}
.row .ttl{font-weight:700;font-size:14.5px;line-height:1.5}
.row .one{font-size:13px;color:var(--soft);margin-top:2px}
.row .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.row .wh{font-size:12px;color:var(--mut);white-space:nowrap;text-align:end}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--gline);overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--soft);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--pill);color:var(--pillTxt)}
.seg button .num{opacity:.65;font-size:11px;margin-inline-start:6px;display:inline-block}
/* ---------- agenda ---------- */
.tl{position:relative;padding-inline-start:20px}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:5px;width:1px;background:var(--line2)}
.tli{position:relative;padding:7px 0;display:grid;grid-template-columns:52px 1fr;gap:10px}
.tli::before{content:"";position:absolute;inset-inline-start:-19px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--bg0);border:1.5px solid var(--line2)}
.tli.hl::before{background:var(--gold);border-color:var(--gold)}
.tli.past{opacity:.5}
.tli .tm{font:500 12.5px Cairo,monospace;color:var(--soft);padding-top:2px}
.tli .tt{font-size:13.5px}.tli .tw{font-size:11.5px;color:var(--mut)}
.nowl{position:relative;border-top:1px dashed var(--gold);margin:6px 0}
.nowl span{position:absolute;top:-10px;inset-inline-end:0;font:500 11px Cairo,monospace;color:var(--gold);background:var(--glass2);border-radius:6px;padding:0 6px}
/* ---------- CA charts ---------- */
.gantt{position:relative;padding:4px 0}
.gaxis{position:relative;height:22px;direction:ltr;margin:0 150px 0 8px;border-bottom:1px solid var(--line)}
html[dir="ltr"] .gaxis{margin:0 8px 0 150px}
.gaxis span{position:absolute;transform:translateX(-50%);font:400 10.5px Cairo,monospace;color:var(--mut);top:2px}
.grow{display:grid;grid-template-columns:142px 1fr;gap:8px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.grow .gn b{display:block;font-size:13.5px}.grow .gn small{font-size:11.5px;color:var(--mut)}
.gtr{position:relative;height:46px;direction:ltr;margin-inline-end:8px}
.gbar{position:absolute;height:10px;border-radius:5px;transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease)}
.in .gbar{transform:scaleX(1)}
.gbar.t{top:6px;background:var(--blue)}.gbar.s{top:22px;background:var(--gold)}
.gbar.open{background:linear-gradient(90deg,var(--gold),transparent)!important;border:1px dashed var(--gold)}
.gpt{position:absolute;top:1px;width:2px;height:34px;background:var(--soft);transform:translateX(-1px)}
.gpt.dash{background:repeating-linear-gradient(180deg,var(--amber) 0 4px,transparent 4px 7px)}
.gpt.red{background:var(--down);width:3px}
.gpt span{position:absolute;top:34px;left:50%;transform:translateX(-50%);font:400 10px/1.2 Cairo,sans-serif;color:var(--mut);white-space:nowrap}
.gtoday{position:absolute;top:-28px;bottom:0;width:0;border-left:1.5px solid var(--gold);z-index:2}
.gtoday span{position:absolute;bottom:-14px;left:4px;font:700 10px Cairo,monospace;color:var(--gold);white-space:nowrap}
.glg,.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:20px}
.glg i,.legend i{display:inline-block;width:12px;height:8px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.legend span{display:inline-flex;align-items:center}
.load{display:flex;align-items:flex-end;gap:3px;height:130px;direction:ltr;padding-top:12px}
.load .c{flex:1;display:flex;flex-direction:column-reverse;gap:1px;height:100%;position:relative;cursor:pointer;min-width:0}
.load .c .s{border-radius:3px;transform:scaleY(0);transform-origin:bottom;transition:transform .6s var(--ease)}
.in .load .c .s{transform:scaleY(1)}
.load .c .s.a{background:var(--gold)}.load .c .s.l{background:var(--blue)}.load .c .s.x{background:var(--down)}
.load .c.we{opacity:.35}
.load .c.sel{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.load .c em{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font:400 9.5px Cairo,monospace;color:var(--mut);font-style:normal}
.load .c.td em{color:var(--gold);font-weight:700}
.load .c b{position:static;text-align:center;font:500 10px Cairo,monospace;color:var(--soft)}
.circ{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--goldbg)}
.circ small{color:var(--gold);font-size:12px;margin-inline-end:auto}
.cb,.mini{border:1px solid var(--line2);background:var(--glass2);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--soft);white-space:nowrap}
.cb:hover,.mini:hover{border-color:var(--gold);text-decoration:none}
.cwait{font-size:12.5px;color:var(--amber)}
.chg{border-radius:16px;padding:12px 16px;background:var(--glass);border:1px solid var(--gline)}
/* ---------- MM / markets ---------- */
.mmc{padding:16px 18px}
.mmc .cd{font:700 12px Cairo,monospace;color:var(--gold);letter-spacing:.06em}
.mmc .nm{font-weight:700;font-size:14px}
.mmc .px{display:flex;align-items:baseline;gap:10px;margin:8px 0}
.mmc .px b{font:700 28px Cairo,monospace}
.mtr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px}
.mtr span{color:var(--mut);display:block}.mtr b{font:500 12.5px Cairo,monospace}.mtr b.na{color:var(--mut);font:400 12.5px Cairo,sans-serif}
.mmc .nt{font-size:12.5px;color:var(--soft);margin-top:8px}
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.hr{padding:12px 14px;border-radius:16px}
.hr b{font-size:13.5px}.hr .tm{font:400 12px Cairo,monospace;color:var(--soft);display:block}
.hr .stt{font-size:12px;display:flex;align-items:center;gap:6px;margin-top:2px}
.hr .pb{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden;direction:ltr}
.hr .pb i{display:block;height:100%;background:var(--up);border-radius:2px}
.hr .nh{font-size:11.5px;color:var(--mut);margin-top:6px}
.live{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mtabs button{border:1px solid var(--gline);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.mtabs button.on{background:var(--pill);color:var(--pillTxt)}
.mpanel{padding:20px}
.idxs{display:flex;gap:24px;flex-wrap:wrap;margin:8px 0 12px}
.idxs small{display:block;color:var(--mut);font-size:12px}
.idxs span{display:flex;gap:8px;align-items:baseline;direction:ltr}
.idxs b{font:700 20px Cairo,monospace}.idxs em{font:500 13px Cairo,monospace;font-style:normal}
.hol{width:100%;border-collapse:collapse;font-size:13px}.hol td{padding:8px 4px;border-bottom:1px solid var(--line)}
/* ---------- news / studies ---------- */
.nw{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.imp{display:flex;gap:2px}.imp i{width:5px;height:14px;border-radius:2px;background:var(--line2)}
.nw .ttl{font-weight:700;font-size:15px;line-height:1.5}.nw .one{font-size:13.5px;color:var(--soft)}
.impg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.impg div{border-radius:14px;padding:10px 12px;background:var(--glass2);font-size:13.5px}
.impg h4{margin:0 0 4px;font-size:12px;color:var(--gold);font-weight:700}
.stc{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.stc .k{font:700 12px Cairo,monospace;color:var(--gold)}
.stc h3{font-size:16px;line-height:1.45}.stc .q{color:var(--soft);font-size:13.5px}
.vd{font-size:13.5px;padding:9px 12px;border-radius:12px;background:var(--goldbg)}
.flds{display:grid;gap:10px}.flds h4{font-size:12.5px;color:var(--gold)}.flds p{margin:2px 0 0;font-size:14px;color:var(--soft)}
.gap{border-inline-start:3px solid var(--amber);padding:10px 14px;background:var(--amberbg);border-radius:12px;font-size:13.5px}
.allsrc{columns:3 220px;column-gap:20px;font-size:12.5px;margin-top:10px}
.allsrc a{display:block;break-inside:avoid;color:var(--soft);padding:2px 0}
/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,15,20,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:61;top:12px;bottom:12px;inset-inline-end:12px;width:min(560px,calc(100% - 24px));border-radius:26px;display:flex;flex-direction:column;transform:translateX(-110%);transition:transform .45s var(--ease);background:var(--glass2)}
html[dir="ltr"] .drawer{transform:translateX(110%)}
.drawer.on{transform:none!important}
.drawer .dh{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drawer .dh h3{font-size:17px;line-height:1.45;flex:1}
.drawer .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--glass);flex:none}
.drawer .db{overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px;font-size:14.5px}
.drawer .db p{margin:0}
.drawer .db .det{display:flex!important;flex-direction:column;gap:14px;border:0;margin:0;padding:0}
/* ---------- dialogs ---------- */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:rgba(3,15,20,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pal{width:min(640px,calc(100vw - 32px));margin:12vh auto 0;border-radius:22px;overflow:hidden;animation:pop .22s var(--ease);color:var(--txt);background:var(--glass2)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;font-size:16px;padding:16px 18px;outline:none}
.pres{max-height:55vh;overflow:auto;padding:6px}
.pr{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 12px;border-radius:12px;cursor:pointer;align-items:baseline}
.pr.on,.pr:hover{background:var(--glass)}
.pr small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pemp{padding:20px;color:var(--mut);text-align:center;font-size:13.5px}
.pal .ft{display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.shr{width:min(640px,calc(100vw - 32px));margin:10vh auto 0;border-radius:22px;padding:18px;color:var(--txt);background:var(--glass2)}
.shr textarea{width:100%;height:300px;background:var(--glass);color:var(--txt);border:1px solid var(--line);border-radius:12px;font:13px/1.6 Cairo,sans-serif;padding:10px}
.shr .r{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;align-items:center}
.btn{border:1px solid var(--line2);background:var(--glass);border-radius:999px;padding:7px 16px;font-size:13px}
.btn.pr2{background:var(--pill);border-color:var(--pill);color:var(--pillTxt);font-weight:700}
#printCirc{display:none}
.vtitle{display:none}
html:not(.app) .vtitle{display:block}
html:not(.app) .rail,html:not(.app) .dock,html:not(.app) .drawer,html:not(.app) .scrim{display:none}

/* ---------- live additions ---------- */
.mark{background:#004652!important;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}.mark img{width:26px;height:26px;display:block}
.lg-l{display:none}:root[data-theme="light"] .lg-d{display:none}:root[data-theme="light"] .lg-l{display:block}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .lg-d{display:none}:root:not([data-theme="dark"]) .lg-l{display:block}}
.mark .lg-d{display:block}.mark .lg-l{display:none!important}
.datec{position:relative;display:flex;align-items:center;gap:4px}
.dbtn{gap:6px;padding:0 12px;font-family:Cairo,sans-serif}
#calLatest.on{background:var(--pill);color:var(--pillTxt)}
.tb:disabled{opacity:.35;cursor:not-allowed}
.calpop{position:absolute;top:calc(100% + 8px);inset-inline-start:0;z-index:50;width:290px;padding:12px;border-radius:18px;background:var(--glass2)}
.cph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cph b{font-size:13.5px}
.cph button,.cpf button{background:var(--glass);border:1px solid var(--line2);border-radius:999px;padding:2px 10px;font-size:13px}
.cph button:disabled{opacity:.3;cursor:default}
.cpg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cpg .wd{font-size:10.5px;color:var(--mut);padding:2px 0}
.cpg button{font:500 12.5px Cairo,monospace;padding:6px 0;border-radius:8px;border:1px solid transparent;background:none}
.cpg button:disabled{color:var(--mut);opacity:.35;cursor:default}
.cpg button.has{background:var(--glass);border-color:var(--line2)}
.cpg button.sel{background:var(--pill);color:var(--pillTxt);border-color:var(--pill)}
.cpg button.tod{outline:1px solid var(--gold);outline-offset:-3px}
.cpf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--mut);gap:8px}
.note{max-width:1320px;width:calc(100% - 24px);margin:10px auto 0;padding:10px 16px;border-radius:16px;font-size:13px;color:var(--amber)}
.updbar{position:fixed;bottom:max(80px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:70;display:flex;gap:10px;align-items:center;padding:8px 10px 8px 16px;border-radius:999px;font-size:13.5px}
@media (min-width:1100px){.updbar{bottom:20px}}
.updbar .x{background:none;border:0;color:var(--mut);font-size:14px}
.gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:16px;background:radial-gradient(120% 90% at 80% 0%,var(--bg1),var(--bg0) 60%);transition:opacity .5s ease}
.gate[hidden]{display:none}.gate.out{opacity:0;pointer-events:none}
.gbg{position:absolute;inset:0;overflow:hidden;z-index:-1}
.gbg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6}
.gbg i:first-child{width:46vw;height:46vw;background:var(--o2);top:-10vw;inset-inline-end:-8vw}
.gbg i:last-child{width:36vw;height:36vw;background:var(--o3);bottom:-10vw;inset-inline-start:-6vw;opacity:.35}
.gbrand{display:flex;flex-direction:column;align-items:center;gap:12px;animation:bi .8s var(--ease) both}
.glogo{width:96px;height:auto}
.gname{text-align:center}.gname b{display:block;font:700 20px Cairo,sans-serif}.gname span{font-size:13px;color:var(--mut)}
.gload{font-size:12.5px;color:var(--mut)}
.gate.pw .gload{display:none}
.gbox{display:none;width:min(380px,100%);padding:24px;border-radius:24px;gap:12px;text-align:center;background:var(--glass2)}
.gate.pw .gbox{display:grid;animation:bi .5s var(--ease) both}
.gbox h2{font-size:18px}.gbox p{margin:0;color:var(--mut);font-size:13px}
.gbox input[type=password]{font:inherit;font-size:15px;padding:11px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--glass);color:var(--txt);text-align:center}
.grem{font-size:12.5px;color:var(--soft);display:flex;gap:6px;align-items:center;justify-content:center}
.gbox .btn{padding:11px;font-size:14px}
.gerr{color:var(--down)!important}
@media (max-width:680px){.datec{order:2;flex:1;justify-content:center}.calpop{position:fixed;top:auto;bottom:12px;inset-inline:12px;width:auto}}

.ipo{padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}.ipo .chip{white-space:normal}#ipoFl .seg{flex:0 1 auto}.ipo h3{font-size:17px;line-height:1.4}.ipo .so{color:var(--soft);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}.ipo .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:auto}.ipo .keys b{font:700 13.5px/1.4 Cairo,sans-serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}.ipo .keys small{display:block}.ctxl{display:grid;gap:6px;font-size:13px}.ctxl div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}.ctxl b{font-weight:700}.deskh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;border-color:color-mix(in srgb,var(--gold) 40%,transparent)}#desk .rec small{display:block}
/* ---------- responsive ---------- */
@media (max-width:1099px){.rail{display:none}}
@media (min-width:1100px){.dock{display:none}}
@media (max-width:1000px){.ovg{grid-template-columns:1fr}.c3,.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:680px){
 .top{border-radius:22px;top:6px}.ask{order:3;max-width:none;flex-basis:100%}.brand small{max-width:22ch}
 .c2,.c3,.c4,.impg,.vps{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.keys{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hero{padding:20px}.br{grid-template-columns:80px 1fr 60px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .row{grid-template-columns:minmax(0,1fr)}.row .wh{text-align:start}.row>.sd{display:flex;gap:6px;align-items:center}
 .grow{grid-template-columns:1fr}.gaxis,html[dir="ltr"] .gaxis{margin:0 8px}
 .drawer{top:auto;bottom:0;inset-inline:0;width:100%;max-height:88vh;border-radius:26px 26px 0 0;transform:translateY(105%)!important}
 .drawer.on{transform:none!important}
 .tbl .hm{display:none}
}
/* ---------- v2.1: complete text, compact mobile shell ---------- */
#stamp{white-space:normal;overflow:visible;max-width:none;cursor:pointer;line-height:1.45}
.kp small,.br .lb{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.35}
.dlink[data-cadaygo]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.relb{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:4px}
.relb .warn{background:var(--amberbg);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.relb .mini{white-space:normal;text-align:center}
.tb.mo{display:none}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 12px;line-height:1.1}
.dock svg,#moreSheet svg{width:18px;height:18px;flex:none}
#moreSheet{position:fixed;bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 72px);left:50%;transform:translateX(-50%);z-index:36;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:8px;border-radius:22px;width:min(380px,calc(100% - 24px));background:var(--glass2)}
#moreSheet[hidden]{display:none}
#moreSheet button{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:14px;padding:11px 12px;font-size:13.5px;color:var(--soft);text-align:start;min-height:44px}

 const ats=[...D.pri,...D.news,...D.ev2,...D.mk].map(x=>x.at).concat(D.ev.map(r=>r[5])).filter(Boolean).sort();LAST_AT=ats.length?ats[ats.length-1]:''}
async function loadStudies(d){let out=[];STDATE='';const deps=Object.keys(IXSD||{});
 for(const dp of deps){const sd=(IXSD[dp]||[]).filter(x=>x<=d).pop();if(!sd)continue;
  try{if(!SCACHE[sd])SCACHE[sd]=await openData(await getJ("data/studies/"+sd+".json"));out=out.concat((SCACHE[sd]||[]).filter(x=>x.dep===dp));if(sd>STDATE)STDATE=sd}catch(e){}}
 if(!out.length){const sd=SDATES.filter(x=>x<=d).pop()||SDATES[0];if(sd){try{if(!SCACHE[sd])SCACHE[sd]=await openData(await getJ("data/studies/"+sd+".json"));out=SCACHE[sd]||[];STDATE=sd}catch(e){}}}
 return out}
async function loadIpo(d){IPODATE='';const sd=d===LATEST?IXIPO[IXIPO.length-1]:IXIPO.filter(x=>x<=d).pop();if(!sd)return null;try{if(!ICACHE[sd])ICACHE[sd]=await openData(await getJ('data/ipo/'+sd+'.json'));IPODATE=sd;return JSON.parse(JSON.stringify(ICACHE[sd]))}catch(e){return null}}
async function mergeUpd(j,d){const list=(UPD[d]||[]).slice().sort();
 for(const t of list){let u;try{u=await openData(await getJ("data/updates/"+d+"/"+t+".json"))}catch(e){continue}if(!u)continue;const at=u.at||(t.slice(0,2)+":"+t.slice(2));
  ["news","pri","ev2"].forEach(k=>{if(Array.isArray(u[k])){j[k]=j[k]||[];u[k].forEach(x=>{x.at=at;j[k].unshift(x)})}});
  if(Array.isArray(u.ev)){j.ev=j.ev||[];u.ev.forEach(r=>{const c=r.slice();c[5]=at;j.ev.push(c)})}
  if(u.signal&&u.signal.t){j.signal=u.signal;j._sigAt=at}
  if(u.stk)j.stk=Object.assign(j.stk||{},u.stk);
  if(Array.isArray(u.mk))u.mk.forEach(m=>{m.at=at;const i=(j.mk||[]).findIndex(x=>x.id===m.id);if(i>=0)j.mk[i]=m;else(j.mk=j.mk||[]).push(m)});
  if(Array.isArray(u.tape))j.tape=u.tape;
  if(u.mm&&u.mm.co)j.mm=Object.assign(j.mm||{},u.mm);
  if(u.ipo){j.ipo=j.ipo||{items:[],post:[],ctx:{}};['items','post'].forEach(k=>(u.ipo[k]||[]).forEach(x=>{x.at=at;j.ipo[k]=j.ipo[k]||[];const i=j.ipo[k].findIndex(y=>y.id===x.id);if(i>=0)j.ipo[k][i]=x;else j.ipo[k].push(x)}));if(u.ipo.ctx)j.ipo.ctx=Object.assign(j.ipo.ctx||{},u.ipo.ctx)}
  if(u.inf&&Array.isArray(u.inf.items)){j.inf=j.inf||{view:{pts:[]},items:[]};u.inf.items.forEach(x=>{x.at=at;const i=j.inf.items.findIndex(y=>y.id===x.id);if(i>=0)j.inf.items[i]=x;else j.inf.items.push(x)});if(u.inf.view)j.inf.view=u.inf.view}
  if(Array.isArray(u.sources)&&u.sources.length){j.sources=j.sources||[];if(j.sources[0]&&u.sources[0])j.sources[0]=[j.sources[0][0]+" "+u.sources[0][0],j.sources[0][1]+" "+u.sources[0][1]];else j.sources=j.sources.concat(u.sources)}}}
async function goDay(d){if(!DATES.length)return;let req=null;
 if(!DATES.includes(d)){const e=DATES.filter(x=>x<=d).pop()||DATES[0];if(e!==d)req=d;d=e}
 BUSY=true;NOTE="loading";calUI();
 try{const j=await openData(await getJ("data/"+d+".json"));
  if(!(j.studies&&j.studies.length))j.studies=await loadStudies(d);else STDATE=d;
  if(!j.ipo)j.ipo=await loadIpo(d);
  try{await loadKB()}catch(e){}
  try{await loadCalc()}catch(e){}
  await mergeUpd(j,d);setDay(j,d);VIEWD=d;PREV=null;
  const pi=DATES.indexOf(d)-1;if(pi>=0){const p=DATES[pi];try{PREV=PC[p]||(PC[p]=await openData(await getJ("data/"+p+".json")));PREV._d=p}catch(e){PREV=null}}
  NOTE=req?{req}:null;
  if(d===LATEST&&(!(await getKeyJ())||ls.get("hubKey")))ls.set("hubLatest",JSON.stringify(j))}
 catch(e){NOTE=e&&e.message==='missing'?'missing':'offline'}
 BUSY=false;renderAll();setView(VIEW,true);hideGate()}
/* --- archive calendar --- */
const fmtD=s=>fd(s)+' '+pd(s).getUTCFullYear();
const WD={ar:['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'],en:['Su','Mo','Tu','We','Th','Fr','Sa']};
const MONL={ar:MAR,en:['January','February','March','April','May','June','July','August','September','October','November','December']};
function calUI(){if(!$('calTxt'))return;$('calTxt').textContent=VIEWD?fd(VIEWD):'—';$('calDate').title=VIEWD?fmtD(VIEWD):'';
 const i=DATES.indexOf(VIEWD);$('calPrev').disabled=BUSY||!(i>0);$('calNext').disabled=BUSY||!(i>=0&&i<DATES.length-1);
 const isL=LATEST&&VIEWD===LATEST;$('calLatest').classList.toggle('on',!!isL);$('calLatest').textContent=T('الأحدث','Latest');
 if(!$('calPop').hidden)drawCal();
 let t='';
 if(NOTE==='offline')t=VIEWD?T('تعذر الاتصال بمصدر التحديث اليومي، والمعروض بيانات محفوظة بتاريخ ','Could not reach the daily update source. Showing saved data from ')+fmtD(VIEWD)+'.':T('تعذر الاتصال بمصدر التحديث اليومي. تحقق من الاتصال بالإنترنت ثم أعد فتح الصفحة.','Could not reach the daily update source. Check your connection and reopen the page.');
 else if(NOTE==='missing')t=T('ملف هذا اليوم غير موجود في الأرشيف.','This day\'s file is missing from the archive.');
 else if(NOTE==='loading')t=T('جارٍ تحميل البيانات…','Loading data…');
 else if(LATEST&&VIEWD&&!isL)t=T('أرشيف: أنت تعرض بيانات ','Archive: you are viewing ')+fmtD(VIEWD)+(NOTE&&NOTE.req?T(` (لا يوجد تحديث يوم ${fmtD(NOTE.req)}، فعُرض أقرب يوم سابق)`,` (no update on ${fmtD(NOTE.req)}, showing the nearest earlier day)`):'')+` · <button type="button" class="mini" id="calBack">${T('العودة للأحدث','Back to latest')}</button>`;
 if(D.rebuilt&&VIEWD)t=(t?t+'<br>':'')+T('أرشيف مُعاد بناؤه: جُمعت بيانات هذا اليوم لاحقًا من مصادر مؤرشفة، والأجندة وملاحظات الإدارات مختصرة.','Rebuilt archive: this day\'s data was gathered later from archived sources; the agenda and department notes are brief.');
 if(window.__NEWBUILD)t=(t?t+'<br>':'')+T('يوجد إصدار أحدث من الصفحة. افتح الرابط: ','A newer version of this page is available. Open the link: ')+`<a href="${GH}" target="_blank" rel="noopener">${GH}</a>`;
 $('calNote').innerHTML=t;$('calNote').hidden=!t||NOTE==='loading'}
function drawCal(){const p=$('calPop');const base=CALM||(VIEWD||LATEST||new Date().toISOString().slice(0,10)).slice(0,7);CALM=base;
 const [y,mo]=base.split('-').map(Number);const first=new Date(Date.UTC(y,mo-1,1)),days=new Date(Date.UTC(y,mo,0)).getUTCDate(),off=first.getUTCDay();
 const ym=(Y,M)=>`${Y}-${String(M).padStart(2,'0')}`;const prev=mo===1?ym(y-1,12):ym(y,mo-1),next=mo===12?ym(y+1,1):ym(y,mo+1);
 const minM=(DATES[0]||base).slice(0,7),maxM=(LATEST||base).slice(0,7);const today=new Date().toISOString().slice(0,10);
 let cells=WD[lang].map(w=>`<span class="wd">${w}</span>`).join('')+'<span></span>'.repeat(off);
 for(let dd=1;dd<=days;dd++){const ds=`${base}-${String(dd).padStart(2,'0')}`,has=DATES.includes(ds);cells+=`<button type="button" data-cday="${ds}" class="${has?'has':''}${ds===VIEWD?' sel':''}${ds===today?' tod':''}"${has?'':' disabled'}>${dd}</button>`}
 p.innerHTML=`<div class="cph"><button type="button" data-cm="${prev}" ${prev<minM?'disabled':''} aria-label="prev">${lang==='ar'?'›':'‹'}</button><b>${MONL[lang][mo-1]} ${y}</b><button type="button" data-cm="${next}" ${next>maxM?'disabled':''} aria-label="next">${lang==='ar'?'‹':'›'}</button></div><div class="cpg">${cells}</div><div class="cpf"><span>${T('الأيام المحددة فيها بيانات','Outlined days have data')}</span><button type="button" data-cday="${LATEST||''}">${T('الأحدث','Latest')}</button></div>`}
function calOpen(o){if(o){CALM=null;drawCal()}$('calPop').hidden=!o;$('calDate').setAttribute('aria-expanded',o)}
$('calDate').addEventListener('click',e=>{e.stopPropagation();calOpen($('calPop').hidden)});
$('calPop').addEventListener('click',e=>{e.stopPropagation();const m=e.target.closest('[data-cm]');if(m&&!m.disabled){CALM=m.dataset.cm;drawCal();return}
 const d=e.target.closest('[data-cday]');if(d&&d.dataset.cday&&!d.disabled){calOpen(false);goDay(d.dataset.cday)}});
document.addEventListener('click',e=>{if(!$('calPop').hidden&&!e.target.closest('#calPop'))calOpen(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')calOpen(false)});
$('calPrev').addEventListener('click',()=>{const i=DATES.indexOf(VIEWD);if(i>0)goDay(DATES[i-1])});
$('calNext').addEventListener('click',()=>{const i=DATES.indexOf(VIEWD);if(i<DATES.length-1)goDay(DATES[i+1])});
$('calLatest').addEventListener('click',()=>{if(LATEST)goDay(LATEST)});
$('calNote').addEventListener('click',e=>{if(e.target.id==='calBack'&&LATEST)goDay(LATEST)});
/* --- what changed since the previous day --- */
function caKeys(x){const m=new Map();(x.ev||[]).forEach(r=>m.set(`${r[0]}|${r[2]}|${r[3]}`,{d:r[0],co:r[2],ca:r[1],k:r[3]==='o'?['جمعية عادية','Ordinary assembly']:r[3]==='oe'?['جمعية عادية وغير عادية','Ordinary & extraordinary assembly']:['جمعية غير عادية','Extraordinary assembly'],m:'otc'}));
 (x.ev2||[]).forEach(e=>m.set(`${e.d}|${e.e}|${(e.k||[])[1]}`,{d:e.d,co:e.e,ca:e.a,k:e.k||['',''],m:'listed'}));return m}
function renderChanges(){const el=$('chgBox');const nw=CA.filter(e=>e.at);
 const today=nw.length?`<div style="margin-top:6px">${nw.map(e=>`<span style="font-size:13px;margin-inline-end:12px;display:inline-block">${newChip(e.at)} ${esc(lang==='ar'?e.na:e.ne)} · ${esc(L(e.k))} · ${fds(e.d)}</span>`).join('')}</div>`:'';
 if(!PREV){el.innerHTML=today?`<div class="chg"><b style="font-size:13.5px">${T('أضيف اليوم','Added today')}</b>${today}</div>`:'';return}
 const a=caKeys(PREV),b=caKeys(D);const ck=v=>`${v.co}|${L(v.k)}`;const prevBy=new Map([...a.values()].map(v=>[ck(v),v]));const curBy=new Map([...b.values()].map(v=>[ck(v),v]));
 const added=[],moved=[],gone=[];
 b.forEach((v,k)=>{if(a.has(k))return;const p=prevBy.get(ck(v));if(p&&p.d!==v.d)moved.push([p,v]);else if(!p)added.push(v)});
 a.forEach((v,k)=>{if(b.has(k))return;if(v.d>=D.today&&!curBy.has(ck(v)))gone.push(v)});
 const nm=v=>esc(lang==='ar'?v.ca:v.co);const li=(arr,f)=>arr.slice(0,10).map(f).join('')+(arr.length>10?`<li class="mut">+${arr.length-10}</li>`:'');
 const head=`<b style="font-size:13.5px">${T('ما الجديد منذ ','What changed since ')}${fmtD(PREV._d)}</b>`;
 if(!added.length&&!moved.length&&!gone.length){el.innerHTML=`<div class="chg">${head} <span class="mut" style="font-size:13px">· ${T('لا تغييرات في الإجراءات المؤسسية.','No changes in corporate actions.')}</span>${today}</div>`;return}
 el.innerHTML=`<div class="chg">${head} <span class="mut" style="font-size:13px">· ${T('جديد','new')} ${added.length} · ${T('تغيّر موعده','date changed')} ${moved.length} · ${T('لم يعد مذكورًا','no longer listed')} ${gone.length}</span>${today}
 <div class="grid c3" style="margin-top:8px;font-size:13px">${added.length?`<div><span class="lbl">${T('جديد','New')}</span><ul style="margin:4px 0;padding-inline-start:18px">${li(added,v=>`<li>${fds(v.d)} · ${nm(v)} · ${esc(L(v.k))}${v.m==='otc'?' · OTC':''}</li>`)}</ul></div>`:''}${moved.length?`<div><span class="lbl">${T('تغيّر الموعد','Date changed')}</span><ul style="margin:4px 0;padding-inline-start:18px">${li(moved,([p,v])=>`<li>${nm(v)} · ${esc(L(v.k))}: ${fds(p.d)} ← ${fds(v.d)}</li>`)}</ul></div>`:''}${gone.length?`<div><span class="lbl">${T('لم يعد مذكورًا (تحقق من الإفصاح)','No longer listed (check the disclosure)')}</span><ul style="margin:4px 0;padding-inline-start:18px">${li(gone,v=>`<li>${fds(v.d)} · ${nm(v)} · ${esc(L(v.k))}</li>`)}</ul></div>`:''}</div></div>`}
/* --- stock cards --- */
function stkBtn(k){return D.stk&&D.stk[k]?` <button type="button" class="mini" data-stk="${esc(k)}">${esc(D.stk[k].s||k)} ↗</button>`:''}
function openRaw(kind,title,html){$('drwK').textContent=kind;$('drwT').textContent=title;$('drwB').innerHTML=html;lastFocus=document.activeElement;$('drawer').classList.add('on');$('drawer').setAttribute('aria-hidden','false');$('scrim').classList.add('on');$('drwB').scrollTop=0}
document.addEventListener('click',e=>{const b=e.target.closest('[data-stk]');if(!b)return;e.preventDefault();e.stopPropagation();const k=b.dataset.stk,s=D.stk[k];if(!s)return;
 const n=v=>v===undefined||v===null||v===''?'—':(typeof v==='number'?v.toLocaleString('en-US'):esc(v));
 const kv=[[T('آخر إغلاق','Last close'),s.last],[T('الإغلاق السابق','Prev close'),s.prev],[T('الافتتاح','Open'),s.open],[T('أعلى','High'),s.hi],[T('أدنى','Low'),s.lo],[T('القيمة د.ك','Value KD'),s.val!=null?Math.round(s.val):null]];if(s.vol)kv.push([T('الكمية','Volume'),s.vol]);if(s.y)kv.push([T('نطاق السنة','52-week'),s.y[0]+'–'+s.y[1]]);
 let spark='';if(s.h&&s.h.length>1){const v=s.h.map(x=>x[1]),mn=Math.min(...v)-2,mx=Math.max(...v)+2,W=320,H=90,px=i=>14+i*(W-28)/(v.length-1),py=y=>H-18-(y-mn)/(mx-mn)*(H-36);
  spark=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;direction:ltr" role="img"><polyline fill="none" stroke="var(--gold)" stroke-width="2" points="${v.map((y,i)=>px(i)+','+py(y)).join(' ')}"/>${v.map((y,i)=>`<circle cx="${px(i)}" cy="${py(y)}" r="${i===v.length-1?4:2.5}" fill="${i===v.length-1?'var(--gold2)':'var(--mut)'}"/><text x="${px(i)}" y="${H-2}" fill="var(--mut)" font-size="9" text-anchor="middle" font-family=Cairo>${esc(s.h[i][0])}</text><text x="${px(i)}" y="${py(y)-8}" fill="var(--soft)" font-size="9" text-anchor="middle" font-family=Cairo>${y}</text>`).join('')}</svg>`}
 openRaw(`${esc(s.s||k)} · ${esc(k)} · ${T('بورصة الكويت','Boursa Kuwait')}`,L(s.n)||k,`<div class="eqb"><div class="eqrows">${kv.map(x=>`<div><small>${x[0]}</small><b>${n(x[1])}</b></div>`).join('')}</div></div>${spark}${s.src?srcs([[T('المصدر','Source'),s.src]]):''}`)},true);
/* --- live checks: new data every 10 minutes, new page build --- */
const sigOf=ix=>{const l=(ix.dates||[]).slice().sort().pop()||'';return l+'|'+((ix.upd||{})[l]||[]).length};
function updBar(kind){const b=$('updBar');if(!kind){b.hidden=true;return}$('updTxt').textContent=kind==='page'?T('يوجد إصدار أحدث من الصفحة.','A newer version of the page is available.'):T('يوجد تحديث جديد للبيانات.','New data is available.');$('updBtn').textContent=T('تحديث','Refresh');b.dataset.kind=kind;b.hidden=false}
async function loadIndex(){const ix=await getJ('data/index.json');DATES=(ix.dates||[]).slice().sort();SDATES=(ix.studies||[]).slice().sort();IXSD=ix.studiesDep||{};UPD=ix.upd||{};IXIPO=(ix.ipo||[]).slice().sort();LOADSIG=sigOf(ix);LATEST=DATES[DATES.length-1]}
$('updBtn').addEventListener('click',async()=>{const k=$('updBar').dataset.kind;updBar(null);if(k==='page'){location.reload();return}try{await loadIndex();await goDay(LATEST)}catch(e){}});
$('updX').addEventListener('click',()=>updBar(null));
setInterval(async()=>{if(document.hidden)return;try{const v=await getJ('version.json',true);if(v&&v.build&&v.build!==BUILD){updBar('page');return}
 const ix=await getJ('data/index.json',true);if(ix&&LOADSIG&&sigOf(ix)!==LOADSIG)updBar('data')}catch(e){}},600000);
(async function(){try{const v=await getJ('version.json',true);if(!v||!v.build||v.build===BUILD)return;
 if(/^https?:$/.test(location.protocol)){let seen=null;try{seen=sessionStorage.getItem('hubReload')}catch(e){}
  if(seen!==v.build){try{sessionStorage.setItem('hubReload',v.build)}catch(e){}const u=new URL(location.href);u.searchParams.set('v',v.build);location.replace(u.toString());return}}
 window.__NEWBUILD=1;calUI()}catch(e){}})();
/* --- boot --- */
document.documentElement.classList.add('app');gateText();
(function(){let v=(location.hash||'').slice(1);if(!VIEWS.find(x=>x[0]===v)){v=ls.get('kmh6-view')||'ov'}VIEW=VIEWS.find(x=>x[0]===v)?v:'ov'})();
(function(){if(!ls.get('hubKey'))return;try{const c=JSON.parse(ls.get('hubLatest')||'null');if(c&&c.today){setDay(c,c.today);VIEWD=c.today;renderAll();setView(VIEW,true)}}catch(e){}})();
(async function boot(){NOTE='loading';try{renderShell()}catch(e){}lockUI();
 try{const kj=await getKeyJ();if(kj&&!ls.get('hubKey'))ls.del('hubLatest');await loadIndex();await goDay(LATEST)}
 catch(e){NOTE='offline';renderAll();setView(VIEW,true);hideGate()}})();
